[workspace]
members = ["programs/*"]
resolver = "2"

# Safety: keep overflow checks ON in release builds. DeFi money math must never
# silently wrap. The math/ modules also use explicit checked_* ops on top of this.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
