[package]
name = "impl-perps"
version = "0.1.0"
description = "impl.trade perpetual futures DEX program"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "impl_perps"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
pyth-solana-receiver-sdk = "1.2.0"

# Pinned to the solana 2.3 line so the test toolchain shares one `solana-program`
# (and thus one `Pubkey`/`AccountMeta`/`Instruction`) with anchor-lang 0.32.
[dev-dependencies]
litesvm = "0.7"
solana-sdk = "2.3"
spl-token = "8"
spl-associated-token-account = "7"
