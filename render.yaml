databases:
  - name: impl-trade-postgres
    databaseName: impl_trade
    user: impl_trade

services:
  - type: web
    name: impl-trade-dlob
    env: docker
    dockerfilePath: ./services/dlob/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: RPC_URL
        sync: false
      - key: PORT
        value: 3001

  - type: web
    name: impl-trade-indexer
    env: docker
    dockerfilePath: ./services/indexer/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: RPC_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: impl-trade-postgres
          property: connectionString
      - key: PORT
        value: 3002

  - type: web
    name: impl-trade-ws-gateway
    env: docker
    dockerfilePath: ./services/ws-gateway/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: RPC_URL
        sync: false
      - key: DLOB_URL
        sync: false
      - key: INDEXER_URL
        sync: false
      - key: PORT
        value: 3003
      - key: WS_INTERVAL_MS
        value: 1500

  - type: web
    name: impl-trade-faucet
    env: docker
    dockerfilePath: ./services/faucet/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: RPC_URL
        sync: false
      - key: ANCHOR_WALLET
        sync: false
      - key: USDC_MINT
        sync: false
      - key: PORT
        value: 3004
      - key: FAUCET_AMOUNT_USDC
        value: 10000
      - key: FAUCET_COOLDOWN_MS
        value: 60000

  - type: worker
    name: impl-trade-keeper
    env: docker
    dockerfilePath: ./services/keeper/Dockerfile
    envVars:
      - key: RPC_URL
        sync: false
      - key: ANCHOR_WALLET
        sync: false
      - key: KEEPER_INTERVAL_MS
        value: 10000
